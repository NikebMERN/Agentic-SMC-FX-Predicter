services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DB:-smc_trader}
      MYSQL_USER: ${MYSQL_USER:-smartflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
    expose:
      - "5000"
    volumes:
      - ./data:/app/data
      - ./model:/app/model
      - ./logs:/app/logs
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    command: ["python", "run.py", "worker"]
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./model:/app/model
      - ./logs:/app/logs
      - ./backups:/app/backups

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  db-backup:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_USER: ${MYSQL_USER:-smartflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_DB: ${MYSQL_DB:-smc_trader}
    volumes:
      - ./backups:/backups
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache mysql-client
        echo "0 3 * * * mysqldump -h $$MYSQL_HOST -u$$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DB > /backups/smartflow_$$(date +\%Y\%m\%d_\%H\%M\%S).sql && find /backups -name 'smartflow_*.sql' -mtime +7 -delete" | crontab -
        crond -f -l 2

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
